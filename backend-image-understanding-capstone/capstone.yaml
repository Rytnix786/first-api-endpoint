# capstone.yaml — Evaluator Manifest for AI Image Understanding & Content Matching Engine
name: "flyrank-capstone-image-relevance"
track: "Backend AI Engineering"
author: "Mehedi Hasan (@Rytnix786)"
portfolio_url: "https://mehedi-hasan-llm.vercel.app/"
version: "1.0.0"

run: "python app.py"
seed: "python seed.py"
test: "python -m pytest test_image_matching.py -v"
eval: "python evals/run_eval.py"
base_url: "http://localhost:8000"

endpoints:
  - path: "/api/v1/posts/{post_id}/matches"
    method: "GET"
    description: "Returns ranked candidate images for a blog post with mismatch guard safety checks and human-readable explanations."
  - path: "/api/v1/reviews/approve"
    method: "POST"
    description: "Approves a candidate image recommendation and records to the review audit trail."
  - path: "/api/v1/reviews/reject"
    method: "POST"
    description: "Rejects an image candidate with reason."
  - path: "/api/v1/images"
    method: "GET"
    description: "Lists all ingested images with structured tags and confidence scores."
  - path: "/api/v1/costs"
    method: "GET"
    description: "Returns per-call attributed AI model cost telemetry in micro-cents."
