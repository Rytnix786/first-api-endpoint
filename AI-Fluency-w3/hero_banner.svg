<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090E1A"/>
    </linearGradient>

    <!-- Radial Emerald Ambient Glow -->
    <radialGradient id="emeraldGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Terminal Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.88"/>
    </linearGradient>

    <!-- Benchmark Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111C35" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A1124" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Accent Speedup Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" opacity="0.35"/>
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Base Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- 2. Technical Dot Grid Layer -->
  <rect width="1200" height="630" fill="url(#dotGrid)"/>

  <!-- 3. Ambient Emerald Glow -->
  <rect width="1200" height="630" fill="url(#emeraldGlow)"/>

  <!-- Subtle Top & Bottom Accent Lines -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#10B981" stroke-width="3" opacity="0.7"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#334155" stroke-width="1"/>

  <!-- ================= 4. LEFT PANEL: TERMINAL WINDOW ================= -->
  <g filter="url(#shadow)">
    <!-- Terminal Box -->
    <rect x="70" y="80" width="620" height="470" rx="16" fill="url(#glassGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect x="70" y="80" width="620" height="42" rx="16" fill="#1E293B" opacity="0.6"/>
    <line x1="70" y1="122" x2="690" y2="122" stroke="#334155" stroke-width="1"/>

    <!-- Mac Window Buttons -->
    <circle cx="100" cy="101" r="6" fill="#FF5F56"/>
    <circle cx="120" cy="101" r="6" fill="#FFBD2E"/>
    <circle cx="140" cy="101" r="6" fill="#27C93F"/>

    <!-- Terminal Title -->
    <text x="380" y="106" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500" fill="#94A3B8">app.py — Flask &amp; Redis Microservice</text>

    <!-- Terminal Content Lines -->
    <!-- Line 1: Command launch -->
    <text x="100" y="165" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600" fill="#10B981">❯ docker compose up --build -d</text>

    <!-- Line 2: Container Logs -->
    <text x="100" y="200" font-family="JetBrains Mono, monospace" font-size="14" fill="#64748B">[+] Running 3/3</text>
    <text x="100" y="225" font-family="JetBrains Mono, monospace" font-size="14" fill="#94A3B8"> ✔ Container postgres_db  <tspan fill="#10B981">Healthy</tspan></text>
    <text x="100" y="250" font-family="JetBrains Mono, monospace" font-size="14" fill="#94A3B8"> ✔ Container redis_cache  <tspan fill="#10B981">Healthy</tspan></text>
    <text x="100" y="275" font-family="JetBrains Mono, monospace" font-size="14" fill="#94A3B8"> ✔ Container flask_app    <tspan fill="#10B981">Started (Port 5000)</tspan></text>

    <!-- Line 3: API Request -->
    <text x="100" y="325" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600" fill="#3B82F6">❯ curl -i http://localhost:5000/status</text>

    <!-- Line 4: Response Payload -->
    <text x="100" y="360" font-family="JetBrains Mono, monospace" font-size="13" fill="#64748B">HTTP/1.1 200 OK — Content-Type: application/json</text>
    <text x="100" y="390" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8FAFC">{</text>
    <text x="120" y="415" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8FAFC">  <tspan fill="#38BDF8">"status"</tspan>: <tspan fill="#10B981">"ok"</tspan>,</text>
    <text x="120" y="440" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8FAFC">  <tspan fill="#38BDF8">"redis_status"</tspan>: <tspan fill="#10B981">"ok"</tspan>,</text>
    <text x="120" y="465" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8FAFC">  <tspan fill="#38BDF8">"timestamp"</tspan>: <tspan fill="#F59E0B">"2026-07-30T19:38:00Z"</tspan></text>
    <text x="100" y="490" font-family="JetBrains Mono, monospace" font-size="14" fill="#F8FAFC">}</text>

    <!-- Prompt Cursor -->
    <rect x="115" y="505" width="9" height="18" fill="#10B981" opacity="0.9"/>
  </g>

  <!-- ================= 5. RIGHT PANEL: BENCHMARK & METRICS CARD ================= -->
  <g filter="url(#shadow)">
    <!-- Benchmark Glass Card -->
    <rect x="730" y="80" width="400" height="260" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Header Badge -->
    <rect x="755" y="105" width="165" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="837" y="122" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.5">EXPLAIN ANALYZE</text>

    <text x="755" y="160" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">PostgreSQL Indexing</text>
    <text x="755" y="182" font-family="Inter, sans-serif" font-size="13" fill="#64748B">10,000 Timestamp Filtered Rows</text>

    <!-- Benchmark Metric Comparison -->
    <!-- Seq Scan (Before) -->
    <text x="755" y="222" font-family="JetBrains Mono, monospace" font-size="13" fill="#EF4444">Seq Scan (No Index):</text>
    <text x="960" y="222" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#EF4444" text-anchor="end">0.526 ms</text>
    
    <rect x="755" y="232" width="205" height="6" rx="3" fill="#334155"/>
    <rect x="755" y="232" width="205" height="6" rx="3" fill="#EF4444" opacity="0.8"/>

    <!-- Index Scan (After) -->
    <text x="755" y="267" font-family="JetBrains Mono, monospace" font-size="13" fill="#10B981">Index Scan (B-tree):</text>
    <text x="960" y="267" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#10B981" text-anchor="end">0.054 ms</text>
    
    <rect x="755" y="277" width="205" height="6" rx="3" fill="#334155"/>
    <rect x="755" y="277" width="22" height="6" rx="3" fill="#10B981"/>

    <!-- Speedup Highlight Badge -->
    <rect x="755" y="297" width="350" height="28" rx="8" fill="url(#badgeGrad)"/>
    <text x="930" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">⚡ ~10X FASTER QUERY EXECUTION</text>
  </g>

  <!-- ================= 6. BOTTOM RIGHT: TECH STACK PILLS ================= -->
  <g transform="translate(730, 365)" filter="url(#shadow)">
    <rect x="0" y="0" width="400" height="185" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <text x="25" y="35" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Tech Stack &amp; Architecture</text>
    <text x="25" y="55" font-family="Inter, sans-serif" font-size="12" fill="#64748B">Production Backend Core Standards</text>

    <!-- Row 1 Pills -->
    <!-- Flask Pill -->
    <rect x="25" y="75" width="105" height="32" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="42" cy="91" r="5" fill="#38BDF8"/>
    <text x="54" y="96" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#F8FAFC">Python</text>

    <!-- Docker Pill -->
    <rect x="140" y="75" width="115" height="32" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1"/>
    <circle cx="157" cy="91" r="5" fill="#6366F1"/>
    <text x="169" y="96" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#F8FAFC">Docker</text>

    <!-- Postgres Pill -->
    <rect x="265" y="75" width="110" height="32" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
    <circle cx="282" cy="91" r="5" fill="#3B82F6"/>
    <text x="294" y="96" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#F8FAFC">PostgreSQL</text>

    <!-- Row 2 Pills -->
    <!-- Redis Pill -->
    <rect x="25" y="120" width="105" height="32" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
    <circle cx="42" cy="136" r="5" fill="#EF4444"/>
    <text x="54" y="141" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#F8FAFC">Redis 7</text>

    <!-- SQLite Pill -->
    <rect x="140" y="120" width="115" height="32" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="157" cy="136" r="5" fill="#F59E0B"/>
    <text x="169" y="141" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#F8FAFC">SQLite3</text>

    <!-- REST API Pill -->
    <rect x="265" y="120" width="110" height="32" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <circle cx="282" cy="136" r="5" fill="#10B981"/>
    <text x="294" y="141" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#F8FAFC">REST API</text>
  </g>
</svg>
